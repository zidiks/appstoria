<tui-loader
  [showLoader]="loading || ([menusTreeData, linearMenusData] | apiLoadingState : 'Pending' : true)"
  [overlay]="true"
  size="xl"
>
  <div>
    <form [formGroup]="formGroup" (ngSubmit)="submit()">
      <tui-select
        *ngIf="!menuData?.root"
        class="b-form"
        [valueContent]="!(menusTreeData | apiLoadingState) ? menuContent : parentLoading"
        formControlName="parent"
      >
        <span *ngIf="!(menusTreeData | apiLoadingState)">Родитель</span>
        <ng-template tuiDataList>
          <tui-data-list *ngIf="!(menusTreeData | apiLoadingState); else parentLoading">
            <div class="menu-tree">
              <tui-tree
                [tuiTreeController]="true"
                [value]="menusTreeData"
                [content]="menuItem"
                [childrenHandler]="menuChildHandler"
              ></tui-tree>
              <ng-template
                #menuItem
                let-value
                let-node="node"
              >
                <button
                  tuiOption
                  class="menu-item"
                  [value]="value._id"
                >
                  <tui-svg
                    class="menu-icon"
                    *ngIf="!value.children?.length"
                    src="tuiIconBookmark">
                  </tui-svg>
                  <span>{{ value.name }}</span>
                </button>
              </ng-template>
            </div>
          </tui-data-list>
        </ng-template>
        <ng-template #parentLoading>
          <tui-loader class="tui-space_vertical-3 loader"></tui-loader>
        </ng-template>
      </tui-select>
      <tui-input
        tuiTextfieldSize="m"
        class="tui-space_top-3 tui-space_bottom-5"
        formControlName="name"
      >
        Название
      </tui-input>
      <tui-input
        tuiTextfieldSize="m"
        class="tui-space_top-3 tui-space_bottom-5"
        formControlName="handle"
      >
        Ссылка
      </tui-input>
      <tui-input
        tuiTextfieldSize="m"
        class="tui-space_top-3 tui-space_bottom-5"
        formControlName="code"
      >
        Код
      </tui-input>
      <tui-text-area
        tuiTextfieldSize="m"
        class="tui-space_top-3 tui-space_bottom-5"
        formControlName="description"
        [expandable]="true"
      >
        Описание
      </tui-text-area>
      <button
        tuiButton
        type="submit"
        size="m"
        [disabled]="formGroup.invalid"
      >
        {{ menuData?._id ? 'Сохранить' : 'Добавить' }}
      </button>
    </form>
  </div>
</tui-loader>
