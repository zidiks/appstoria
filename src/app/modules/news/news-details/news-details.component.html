<div class="new">
  <div class="header">
    <div class="header__title">
      <tui-breadcrumbs  size="l">
        <ng-container *ngFor="let item of breadcrumbs">
          <a
            *tuiItem
            tuiLink
            [routerLink]="item.routerLink"
          >
            {{ item.caption }}
          </a>
        </ng-container>
      </tui-breadcrumbs>
    </div>
    <div class="header__actions">
      <button
        size="s"
        tuiButton
        type="button"
        appearance="secondary"
        icon="tuiIconCheck"
        class="tui-space_right-3"
        [showLoader]="loading"
        [disabled]="formGroup.invalid"
        (click)="submit()"
      >
        {{ !articleId ? 'Добавить' : 'Сохранить' }}
      </button>
      <button
        *ngIf="articleId"
        size="s"
        tuiButton
        type="button"
        appearance="secondary-destructive"
        icon="tuiIconTrash"
        class="tui-space_right-3"
        [showLoader]="(articleData | apiLoadingState : 'Pending') || loading"
        (click)="showDeleteDialog()"
      >
        Удалить
      </button>
      <button
        *ngIf="articleId"
        size="s"
        tuiIconButton
        type="button"
        appearance="secondary"
        icon="tuiIconRefresh"
        class="tui-space_right-3"
        (click)="refreshData()"
      >
      </button>
    </div>
  </div>
  <form [formGroup]="formGroup">
    <tui-loader [showLoader]="loading" [overlay]="true" size="l">
      <div class="content">
        <h3 class="tui-form__header tui-form__header_margin-top_none">Общее</h3>
        <div class="tui-form__row">
          <tui-input
            formControlName="title"
          >
            Заголовок
          </tui-input>
        </div>
        <div class="tui-form__row">
          <tui-text-area
            formControlName="description"
            [expandable]="true"
          >
            Описание
          </tui-text-area>
        </div>
        <div class="tui-form__row">
          <tui-tabs class="editor-tabs" [(activeItemIndex)]="editorMode">
            <button
              tuiTab
              (click)="setEditorMode(EditorMode.advanced)"
            >
              <tui-svg
                src="tuiIconDraft"
                class="tui-space_right-2"
              ></tui-svg>
              Визуально
            </button>
            <button
              tuiTab
              (click)="setEditorMode(EditorMode.html)"
            >
              <tui-svg
                src="tuiIconCode"
                class="tui-space_right-2"
              ></tui-svg>
              HTML
            </button>
          </tui-tabs>
          <tui-editor
            *ngIf="editorMode === EditorMode.advanced"
            class="editor"
            [tools]="editorTools"
            formControlName="content"
          >
            Содержание
          </tui-editor>
          <tui-text-area
            *ngIf="editorMode === EditorMode.html"
            formControlName="content"
            [expandable]="true"
          >
            Содержание
          </tui-text-area>
        </div>
        <div class="tui-form__row">
          <tui-input-tag
            formControlName="tags"
          >
            Теги
          </tui-input-tag>
        </div>
      </div>
      <div class="content">
        <h3 class="tui-form__header tui-form__header_margin-top_none">Слайдер</h3>
        <div class="tui-form__row tui-form__row_multi-fields">
          <div class="tui-form__multi-field">
            <tui-checkbox-block
              formControlName="isSlide"
              size="l"
            >
              Отображать как слайд
            </tui-checkbox-block>
          </div>
          <div class="tui-form__multi-field">
            <tui-checkbox-block
              formControlName="hidden"
              size="l"
            >
              Скрыть из блога
            </tui-checkbox-block>
          </div>
        </div>
        <div class="tui-form__row">
          <tui-input
            formControlName="slideTitle"
          >
            Заголовок
          </tui-input>
        </div>
        <div class="tui-form__row">
          <tui-input
            formControlName="slideDescription"
          >
            Описание
          </tui-input>
        </div>
        <div class="tui-form__row">
          <tui-input
            formControlName="slideLink"
          >
            Ссылка
          </tui-input>
        </div>
      </div>
      <div class="content">
        <div formGroupName="seo">
          <h3 class="tui-form__header tui-form__header_margin-top_none">SEO</h3>
          <div class="tui-form__row">
            <tui-input
              formControlName="seoTitle"
            >
              Заголовок
            </tui-input>
          </div>
          <div class="tui-form__row">
            <tui-input
              formControlName="seoDescription"
            >
              Описание
            </tui-input>
          </div>
          <div class="tui-form__row">
            <tui-input-tag
              formControlName="seoKeywords"
            >
              Ключевые слова
            </tui-input-tag>
          </div>
          <div class="tui-form__row seo_btn">
            <tui-input
              class="seo_input"
              formControlName="seoUrl"
            >
              URL адрес
            </tui-input>
            <button
              tuiButton
              type="button"
              class="tui-space_bottom-3"
              (click)="generateUrl(this.formGroup.get('title')?.value)"
            >
              Сгенерировать
            </button>
          </div>
          <div class="tui-form__row">
            <tui-input
              formControlName="seoAuthor"
            >
              Автор
            </tui-input>
          </div>
          <div class="tui-form__row">
            <tui-input
              formControlName="seoImageAlt"
            >
              Изображение Alt атрибут
            </tui-input>
          </div>
        </div>
      </div>
      <div class="content">
        <h3 class="tui-form__header tui-form__header_margin-top_none">Изображение</h3>
        <div class="tui-form__row">
          <tui-input-files
            accept="image/*"
            [multiple]="false"
            formControlName="media"
            (reject)="onReject($event)"
            (ngModelChange)="f['media'].markAsTouched()"
          ></tui-input-files>
          <tui-files class="file tui-space_top-3">
            <ng-container *ngIf="f['media'].value as file">
              <tui-file
                class="files-item"
                state="normal"
                size="l"
                [file]="file"
                (removed)="removeFile(file)"
              >
              </tui-file>
            </ng-container>
          </tui-files>
        </div>
      </div>
    </tui-loader>
  </form>
</div>
