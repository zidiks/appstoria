# Временный режим: только витрина appstoria.by поверх бэка macplus.
#   docker compose -f docker-compose.storefront.yml up -d --build
# Нужен .env с SITE_DOMAIN и ACME_EMAIL (остальное — по умолчанию ниже).
# На бэке macplus в CORS_ORIGINS и PUBLIC_FORM_ALLOWED_ORIGINS должен быть appstoria.by.

services:
  storefront:
    build:
      context: ./storefront
      args:
        API_HOST: ${API_HOST:-https://api.macplus.by}
        NEXT_PUBLIC_HOST: https://${SITE_DOMAIN:-appstoria.by}
        # Ключ виджета macplus: в Cloudflare добавить appstoria.by в его hostnames
        TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-0x4AAAAAADygPJz9Vg2Cf5kV}
    container_name: appstoria-storefront
    restart: always

  caddy:
    image: caddy:2-alpine
    container_name: appstoria-caddy
    restart: always
    depends_on:
      - storefront
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:-appstoria.by}
      ACME_EMAIL: ${ACME_EMAIL:-hello@app-storia.by}
    volumes:
      - ./deploy/Caddyfile.storefront:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
